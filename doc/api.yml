paths:
  /images:
    post:
      summary: Soumettre une image (jpeg/png) avec un email
      operationId: submitImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSubmissionRequest'
      responses:
        '201':
          description: Image soumise et enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSubmissionResponse'
        '400':
          description: Fichier invalide, format non supporté, ou email manquant
    get:
      summary: Lister toutes les images soumises
      operationId: findAllImages
      responses:
        '200':
          description: Liste des images soumises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageSubmissionResponse'

components:
  schemas:
    ImageSubmissionRequest:
      type: object
      required: [fileName, contentType, fileBase64, email]
      properties:
        fileName:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png]
        fileBase64:
          type: string
          format: byte
        email:
          type: string
          format: email
    ImageSubmissionResponse:
      type: object
      required: [id, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        email:
          type: string
        submittedAt:
          type: string
          format: date-time